<svg width="100%" viewBox="0 0 680 120" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>StoreSignal logo compact</title>
  <desc>StoreSignal compact logo with signal mark and wordmark on one line</desc>

  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00FF87;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="darkBg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0F;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#111118;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <rect width="680" height="120" fill="url(#darkBg2)" rx="14"/>

  <circle cx="56" cy="60" r="6" fill="url(#g1)"/>
  <path d="M 41 45 A 21 21 0 0 1 71 45" fill="none" stroke="url(#g1)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 41 75 A 21 21 0 0 0 71 75" fill="none" stroke="url(#g1)" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M 30 34 A 37 37 0 0 1 82 34" fill="none" stroke="url(#g1)" stroke-width="1.8" stroke-linecap="round" opacity="0.45"/>
  <path d="M 30 86 A 37 37 0 0 0 82 86" fill="none" stroke="url(#g1)" stroke-width="1.8" stroke-linecap="round" opacity="0.25"/>

  <text x="104" y="72" font-family="'Syne', 'SF Pro Display', sans-serif" font-size="42" font-weight="800" letter-spacing="-1.5">
    <tspan fill="#F0F0F5">Store</tspan><tspan fill="url(#g1)">Signal</tspan>
  </text>
</svg>
